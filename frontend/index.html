<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ask any maths question and get a short animated lesson that explains it step by step, at your level."
    />
    <meta name="theme-color" content="#050609" />
    <meta name="color-scheme" content="dark" />
    <style>
      html {
        background: #050609;
      }
      /* Hidden before the stylesheet loads, so it never fades out on a page load. In Tailwind's base layer, so the
         sign-out rule in index.css can still show it. */
      @layer base {
        #signing-out {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
    <title>Lerno - Maths you can see</title>
  </head>
  <body>
    <div id="root"></div>
    <p
      id="signing-out"
      role="status"
      class="text-secondary-foreground pointer-events-none fixed inset-0 flex items-center justify-center gap-2.5 text-sm"
    >
      <span class="border-accent-soft/25 border-t-accent-soft size-3.5 animate-spin rounded-full border-[1.5px]"></span>
      Signing you out…
    </p>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
